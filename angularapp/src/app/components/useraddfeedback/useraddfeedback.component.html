<app-loader *ngIf="isLoading"></app-loader>

<div
  class="add-feedback-page"
  *ngIf="!isLoading">

  <div class="add-feedback-card">

    <div class="card-header">

      <div>

        <p class="eyebrow">
          Customer Workspace
        </p>

        <h2>Add Feedback</h2>

        <p class="subtitle">
          Share your feedback, and the manager will review it.
        </p>

      </div>

    </div>

    <div
      class="error-message"
      *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form
      [formGroup]="feedbackForm"
      (ngSubmit)="onSubmit()">

      <div class="form-field">

        <label
          for="feedbackText"
          class="form-label">
          Feedback
        </label>

        <textarea
          id="feedbackText"
          class="form-control"
          rows="6"
          maxlength="500"
          formControlName="feedbackText"
          placeholder="Enter your feedback">
        </textarea>

        <div class="field-footer">

          <div class="validation-area">

            <small
              class="validation-message"
              *ngIf="
                feedbackForm.get('feedbackText')?.touched &&
                feedbackForm.get('feedbackText')?.hasError('required')
              ">
              Feedback is required.
            </small>

            <small
              class="validation-message"
              *ngIf="
                feedbackForm.get('feedbackText')?.touched &&
                feedbackForm.get('feedbackText')?.hasError('minlength')
              ">
              Feedback must contain at least 3 characters.
            </small>

          </div>

          <span class="character-count">
            {{ feedbackForm.get('feedbackText')?.value?.length || 0 }}/500
          </span>

        </div>

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="reset-button"
          [disabled]="isSubmitting || feedbackForm.get('feedbackText')?.value?.length === 0"
          (click)="resetForm()">
          Clear
        </button>

        <button
          type="submit"
          class="submit-button btn-light"
          [disabled]="feedbackForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Submitting...' : 'Submit Feedback' }}
        </button>

      </div>

    </form>

  </div>

</div>
