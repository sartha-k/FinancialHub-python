<app-loader *ngIf="isLoading"></app-loader>

<div
  class="add-enquiry-page"
  *ngIf="!isLoading">

  <div class="add-enquiry-card">

    <div class="card-header">

      <div>

        <p class="eyebrow">
          Customer Workspace
        </p>

        <h2>Add Enquiry</h2>

        <p class="subtitle">
          Submit your question or request, and the manager will review it.
        </p>

      </div>

    </div>

    <div
      class="error-message"
      *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form
      [formGroup]="enquiryForm"
      (ngSubmit)="addEnquiry()">

      <div class="form-field">

        <label
          for="enquiryMessage"
          class="form-label">
          Enquiry Message
        </label>

        <textarea
          id="enquiryMessage"
          class="form-control"
          rows="6"
          maxlength="500"
          formControlName="message"
          placeholder="Enter your enquiry message">
        </textarea>

        <div class="field-footer">

          <div class="validation-area">

            <small
              class="validation-message"
              *ngIf="
                messageControl?.touched &&
                messageControl?.hasError('required')
              ">
              Enquiry message is required.
            </small>

            <small
              class="validation-message"
              *ngIf="
                messageControl?.touched &&
                messageControl?.hasError('minlength')
              ">
              Message must contain at least 3 characters.
            </small>

            <small
              class="validation-message"
              *ngIf="
                messageControl?.touched &&
                messageControl?.hasError('maxlength')
              ">
              Message cannot exceed 500 characters.
            </small>

          </div>

          <span class="character-count">
            {{ messageControl?.value?.length || 0 }}/500
          </span>

        </div>

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="reset-button"
          [disabled]="isSubmitting || messageControl?.value?.length===0"
          (click)="resetForm()">
          Clear
        </button>

        <button
          type="submit"
          class="btn btn-light submit-button"
          [disabled]="enquiryForm.invalid || isSubmitting">

          {{
            isSubmitting
              ? 'Submitting...'
              : 'Submit Enquiry'
          }}

        </button>

      </div>

    </form>

  </div>

</div>
