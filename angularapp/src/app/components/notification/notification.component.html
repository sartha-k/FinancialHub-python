<div
  *ngIf="show"
  class="notification"
  [ngClass]="type">

    <div class="notification-title">

        <span *ngIf="type === 'success'">✓ Success</span>

        <span *ngIf="type === 'error'">✕ Error</span>

        <span *ngIf="type === 'warning'">⚠ Warning</span>

        <span *ngIf="type === 'info'">ℹ Information</span>

    </div>

    <div class="notification-message">
        {{ message }}
    </div>

</div>
